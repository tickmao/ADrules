# 候选源池
#
# 这里记录评估过但暂未纳入 sources 的源，以及纳入与否的理由。
# scripts/discover.py 会定期重新探测它们：上游复活、体积变化或维护恢复时，
# 报告会提示是否值得提升为正式源。
#
# status: candidate（值得观察）| rejected（已否决，附理由）
# 评分维度见 docs/sources.md。

candidates:
  # ---------- DNS / 域名层 ----------
  - id: adguard-dns
    name: "AdGuard DNS Filter"
    status: candidate
    category: security
    region: global
    kind: original
    dimensions: [ads, tracker, malware]
    urls:
      - "https://filters.adtidy.org/extension/ublock/filters/15.txt"
    homepage: "https://github.com/AdguardTeam/AdGuardFilters"
    license: "GPL-3.0"
    note: "官方 DNS 层规则，覆盖 App 内广告；4.5MB，与 ads 类重叠较多，暂列候选"

  - id: hagezi-pro
    name: "HaGeZi's Pro DNS Blocklist"
    status: candidate
    category: security
    region: global
    kind: original
