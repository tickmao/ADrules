    homepage: "https://github.com/hagezi/dns-blocklists"
    license: "GPL-3.0"
    note: "社区口碑极好（28k stars），体积 4.5MB；适合 AdGuard Home 用户"

  - id: oisd-big
    name: "OISD Big"
    status: candidate
